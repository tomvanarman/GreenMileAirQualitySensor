; Standalone SIM7080G bring-up project for the LilyGO T-SIM7080G.
; Default target is LTE Cat-M with the 1NCE APN used by the main firmware.

[platformio]
default_envs = catm

[common]
platform = espressif32@6.3.0
board = esp32s3box
framework = arduino
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0
upload_port = COM*
upload_speed = 921600
board_build.partitions = huge_app.csv
lib_extra_dirs = ../esp32/lib
lib_ldf_mode = deep+
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DTINY_GSM_MODEM_SIM7080
  -DTINY_GSM_RX_BUFFER=1024
  -DTESTSIM_APN=\"iot.1nce.net\"
  -DTESTSIM_GPRS_USER=\"\"
  -DTESTSIM_GPRS_PASS=\"\"
  -DTESTSIM_NETWORK_MODE=2
  -DTESTSIM_HTTP_HOST=\"vsh.pp.ua\"
  -DTESTSIM_HTTP_RESOURCE=\"/TinyGSM/logo.txt\"
  -DTESTSIM_PING_HOST=\"8.8.8.8\"
  -DTESTSIM_REGISTRATION_TIMEOUT_MS=180000UL
  -DTESTSIM_PRE_PMU_DELAY_MS=30000UL

[env:catm]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_dtr = ${common.monitor_dtr}
monitor_rts = ${common.monitor_rts}
upload_port = ${common.upload_port}
upload_speed = ${common.upload_speed}
board_build.partitions = ${common.board_build.partitions}
lib_extra_dirs = ${common.lib_extra_dirs}
lib_ldf_mode = ${common.lib_ldf_mode}
build_flags =
  ${common.build_flags}
  -DTESTSIM_PREFERRED_MODE=1
  -DTESTSIM_RAT_NAME=\"CAT-M\"

